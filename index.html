<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gagarin Gastro Bar | Новый Год</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #2a2a2a; /* Тёмно-серый фон */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            color: #fff;
        }

        /* --- МИШУРА ПО БОКАМ (фиксированная) --- */
        .tinsel-left, .tinsel-right {
            position: fixed;
            top: 0;
            bottom: 0;
            width: 40px;
            z-index: 15;
            pointer-events: none;
            background: repeating-linear-gradient(
                180deg,
                #ff3333 0px, #ff3333 15px,
                #33cc33 15px, #33cc33 30px,
                #ffff33 30px, #ffff33 45px,
                #3366ff 45px, #3366ff 60px,
                #ff3333 60px, #ff3333 75px
            );
            opacity: 0.85;
            border-radius: 0 10px 10px 0;
            box-shadow: 2px 0 10px rgba(255,255,255,0.3);
        }
        .tinsel-left { left: 0; }
        .tinsel-right {
            right: 0;
            border-radius: 10px 0 0 10px;
            box-shadow: -2px 0 10px rgba(255,255,255,0.3);
        }
        /* Добавляем "пушистость" мишуре через псевдоэлементы (шарики) */
        .tinsel-left::before, .tinsel-right::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(circle, #fff 2px, transparent 2px);
            background-size: 15px 25px;
            opacity: 0.6;
        }

        /* --- ЛОГОТИП --- */
        .logo-wrap {
            position: relative;
            margin-top: 50px;
            z-index: 10;
            width: 220px;
            height: 220px;
        }
        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 30px; /* Закруглённые углы */
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            z-index: 2;
        }
        /* Леденцы по углам */
        .candy {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: repeating-conic-gradient(#ff3333 0deg 30deg, #fff 30deg 60deg);
            border: 3px solid #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            z-index: 3;
        }
        .candy.tl { top: -15px; left: -15px; }
        .candy.tr { top: -15px; right: -15px; }
        .candy.bl { bottom: -15px; left: -15px; }
        .candy.br { bottom: -15px; right: -15px; }
        /* Палочка от леденца */
        .candy::after {
            content: '';
            position: absolute;
            width: 6px;
            height: 20px;
            background: #e0e0e0;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 3px;
        }
        .candy.tr::after, .candy.br::after { display: none; } /* Палочки только у левых для красоты */

        /* --- КОНТЕНТ --- */
        .content {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 380px;
            padding: 30px 20px 200px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        /* --- БЕЛЫЕ КНОПКИ С ОБВОДКОЙ --- */
        .btn {
            display: block;
            width: 100%;
            padding: 16px 20px;
            border-radius: 50px;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            color: #2a2a2a; /* Тёмный текст на белом */
            background: #ffffff;
            border: 3px solid transparent;
            background-clip: padding-box;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4), 0 0 0 3px #d4af37; /* Золотая обводка */
            position: relative;
        }
        .btn:active { transform: scale(0.97); }

        /* Разные цвета обводки для кнопок (чтобы не сливались) */
        .btn-yandex { box-shadow: 0 4px 15px rgba(0,0,0,0.4), 0 0 0 3px #fc3f1d; }
        .btn-2gis { box-shadow: 0 4px 15px rgba(0,0,0,0.4), 0 0 0 3px #2b9e4b; }
        .btn-menu { box-shadow: 0 4px 15px rgba(0,0,0,0.4), 0 0 0 3px #ffb347; }

        /* --- СНЕГ (CSS) --- */
        .snow-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1; overflow: hidden;
        }
        .snowflake {
            position: absolute;
            top: -10px;
            color: #fff;
            font-size: 1em;
            opacity: 0.8;
            animation-name: fall;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }
        @keyframes fall { to { transform: translateY(105vh); } }

        /* --- СУГРОБЫ И СНЕГОВИК (внизу) --- */
        .snow-bottom {
            position: fixed;
            bottom: 0; left: 0; width: 100%; height: 160px;
            pointer-events: none; z-index: 20;
        }
        .snow-drift {
            position: absolute;
            bottom: 0; width: 120%; height: 90px;
            background: #fff;
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            left: -10%;
            box-shadow: 0 -5px 20px rgba(255,255,255,0.4);
        }
        .snow-drift.back {
            height: 70px; background: #e0e8f0; bottom: 25px;
            border-radius: 40% 40% 0 0 / 100% 100% 0 0;
            left: -20%; width: 140%; z-index: -1;
        }
        /* Гифка снеговика */
        .snowman-gif {
            position: absolute;
            bottom: 50px;
            right: 30px;
            width: 70px;
            height: auto;
            z-index: 21;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3));
        }

    </style>
</head>
<body>

    <!-- Мишура по бокам -->
    <div class="tinsel-left"></div>
    <div class="tinsel-right"></div>

    <!-- Логотип с леденцами -->
    <div class="logo-wrap">
        <img src="logo.png" alt="Gagarin Gastro Bar" class="logo-img">
        <div class="candy tl"></div>
        <div class="candy tr"></div>
        <div class="candy bl"></div>
        <div class="candy br"></div>
    </div>

    <!-- Кнопки -->
    <div class="content">
        <a href="https://yandex.ru/maps/org/gagarin_gastro_bar/37738191246/?ll=39.837713%2C59.196859&z=17" target="_blank" class="btn btn-yandex">⭐ Оставить отзыв в Яндекс Картах</a>
        <a href="https://go.2gis.com/1yZ9V" target="_blank" class="btn btn-2gis">⭐ Оставить отзыв в 2ГИС</a>
        <a href="https://foodeon.com/venue/gagarin-gastro-bar-slqs" target="_blank" class="btn btn-menu">🍽️ Смотреть онлайн-меню</a>
    </div>

    <!-- Снег -->
    <div class="snow-container" id="snowContainer"></div>

    <!-- Сугробы и снеговик-гифка -->
    <div class="snow-bottom">
        <div class="snow-drift back"></div>
        <div class="snow-drift"></div>
        <img src="snowman.gif" alt="Снеговик" class="snowman-gif">
    </div>

    <script>
        // --- Генерация снега ---
        const snowContainer = document.getElementById('snowContainer');
        const snowflakeCount = 50;
        for (let i = 0; i < snowflakeCount; i++) {
            const flake = document.createElement('div');
            flake.classList.add('snowflake');
            flake.innerHTML = '❄';
            flake.style.left = Math.random() * 100 + '%';
            flake.style.animationDuration = (Math.random() * 3 + 4) + 's';
            flake.style.animationDelay = Math.random() * 5 + 's';
            flake.style.fontSize = (Math.random() * 0.8 + 0.5) + 'em';
            flake.style.opacity = Math.random() * 0.5 + 0.4;
            snowContainer.appendChild(flake);
        }
    </script>
</body>
</html>
