<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gagarin Gastro Bar | Новый Год</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            color: #fff;
            background: #1a1a1a;
        }

        /* --- ФОН fon.jpg с блюром --- */
        .bg-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('fon.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(3px) brightness(0.6);
            z-index: 0;
            transform: scale(1.05); /* чтобы блюр не давал белых краев */
        }

        /* --- ШАПКА shapka.jpg --- */
        .shapka {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: auto;
            z-index: 5;
            pointer-events: none;
        }
        .shapka img {
            width: 100%;
            display: block;
        }

        /* --- КОНТЕНТ --- */
        .main-content {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 380px;
            padding: 0 20px 250px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 100px; /* отступ под шапку */
        }

        /* --- БЛОК С ЛОГО И МИШУРОЙ --- */
        .logo-section {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
            padding-top: 40px; /* место для гифок сверху */
        }

        /* Мишура вокруг лого (gif) — растягиваем под ширину лого */
        .mishura {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 110%;
            height: auto;
            z-index: 3;
            pointer-events: none;
        }

        /* Гирлянда (gif) — под мишурой, с навесом на лого */
        .girlyanda {
            position: absolute;
            top: 15px; /* чуть ниже мишуры, чтобы «нависала» */
            left: 50%;
            transform: translateX(-50%);
            width: 120%;
            height: auto;
            z-index: 2;
            pointer-events: none;
        }

        /* Сам логотип */
        .logo-img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 50%;
            position: relative;
            z-index: 4;
            border: 4px solid rgba(255,255,255,0.8);
            box-shadow: 0 0 30px rgba(255,215,0,0.6);
        }

        /* Адрес и телефон */
        .info-block {
            text-align: center;
            z-index: 10;
            margin-bottom: 25px;
            background: rgba(0,0,0,0.4);
            padding: 8px 15px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
        }
        .info-block p {
            font-size: 13px;
            margin: 3px 0;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        .info-block a {
            color: #ffd700;
            text-decoration: none;
            font-weight: bold;
        }

        /* --- КНОПКИ С RGB ПОДСВЕТКОЙ --- */
        .btn {
            display: block;
            width: 85%;
            max-width: 300px;
            padding: 12px 15px;
            border-radius: 40px;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            color: #1a1a1a;
            background: #ffffff;
            border: none;
            cursor: pointer;
            margin-bottom: 12px;
            position: relative;
            z-index: 10;
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
            transition: transform 0.2s;
            /* Анимация RGB-обводки */
            animation: rgbGlow 4s linear infinite;
        }
        .btn:active { transform: scale(0.96); }

        @keyframes rgbGlow {
            0%   { box-shadow: 0 0 12px 2px #ff3333, 0 0 25px 5px #ff3333; }
            25%  { box-shadow: 0 0 12px 2px #33cc33, 0 0 25px 5px #33cc33; }
            50%  { box-shadow: 0 0 12px 2px #3366ff, 0 0 25px 5px #3366ff; }
            75%  { box-shadow: 0 0 12px 2px #ffff33, 0 0 25px 5px #ffff33; }
            100% { box-shadow: 0 0 12px 2px #ff3333, 0 0 25px 5px #ff3333; }
        }

        /* --- ЁЛКА С ПОДАРКАМИ (CSS) --- */
        .tree-section {
            position: relative;
            z-index: 8;
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        .tree {
            position: relative;
            width: 120px;
            height: 180px;
        }
        /* Треугольники ёлки */
        .tree .tier {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 60px solid transparent;
            border-right: 60px solid transparent;
            border-bottom: 70px solid #1e7a36;
            filter: drop-shadow(0 3px 5px rgba(0,0,0,0.5));
        }
        .tree .tier:nth-child(1) { top: 0; border-bottom-color: #2b9e4b; border-left-width: 45px; border-right-width: 45px; }
        .tree .tier:nth-child(2) { top: 40px; border-bottom-width: 75px; }
        .tree .tier:nth-child(3) { top: 85px; border-bottom-width: 80px; border-bottom-color: #1e7a36; }
        /* Звезда */
        .tree .star {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffd700;
            font-size: 28px;
            text-shadow: 0 0 10px #ffd700;
            z-index: 3;
        }
        /* Подарки */
        .gifts {
            display: flex;
            gap: 10px;
            margin-top: 5px;
            z-index: 9;
        }
        .gift {
            width: 30px; height: 30px;
            border-radius: 4px;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }
        .gift::before {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 6px; height: 100%;
            background: rgba(255,255,255,0.8);
        }
        .gift::after {
            content: '';
            position: absolute;
            top: 50%; left: 0;
            transform: translateY(-50%);
            width: 100%; height: 6px;
            background: rgba(255,255,255,0.8);
        }
        .gift.red { background: #d42e0f; }
        .gift.blue { background: #3366ff; }
        .gift.green { background: #2b9e4b; }

    </style>
</head>
<body>

    <!-- Фон -->
    <div class="bg-layer"></div>

    <!-- Шапка -->
    <div class="shapka">
        <img src="shapka.jpg" alt="Шапка">
    </div>

    <!-- Основной контент -->
    <div class="main-content">

        <!-- Блок с лого, мишурой и гирляндой -->
        <div class="logo-section">
            <!-- Гирлянда (под мишурой) -->
            <img src="girlyalnda.gif" alt="Гирлянда" class="girlyanda">
            <!-- Мишура (над гирляндой, но под лого) -->
            <img src="mishura.gif" alt="Мишура" class="mishura">
            <!-- Логотип -->
            <img src="logo.png" alt="Gagarin Gastro Bar" class="logo-img">
        </div>

        <!-- Адрес и телефон -->
        <div class="info-block">
            <p>📍 ул. Возрождения, 27, Вологда</p>
            <p>📞 <a href="tel:+78172507450">+7 (8172) 50-74-50</a></p>
        </div>

        <!-- Кнопки -->
        <a href="https://foodeon.com/venue/gagarin-gastro-bar-slqs" target="_blank" class="btn">🍽️ Посмотреть меню</a>
        <a href="https://yandex.ru/maps/org/gagarin_gastro_bar/37738191246/?ll=39.837713%2C59.196859&z=17" target="_blank" class="btn">⭐ Оставить отзыв в Яндекс Картах</a>
        <a href="https://go.2gis.com/1yZ9V" target="_blank" class="btn">⭐ Оставить отзыв в 2ГИС</a>

        <!-- Ёлка с подарками -->
        <div class="tree-section">
            <div class="tree">
                <div class="tier"></div>
                <div class="tier"></div>
                <div class="tier"></div>
                <div class="star">⭐</div>
            </div>
            <div class="gifts">
                <div class="gift red"></div>
                <div class="gift blue"></div>
                <div class="gift green"></div>
            </div>
        </div>

    </div>

</body>
</html>
